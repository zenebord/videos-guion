<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destello · guion</title>
<style>
:root{
  --bg:#0e1116; --panel:#171b22; --panel2:#1e242d; --line:#2a313c; --txt:#e6e9ee; --mut:#8b95a5;
  --acc:#ffb547; --acc2:#ffd58a; --ok:#5fd18a; --bad:#ff6b6b;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:58px}
button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--mut)}
button.pri{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:600}
button.pri:hover{background:var(--acc2)}
button.ico{padding:6px 8px;min-width:32px}
.wrap{max-width:1500px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
header h1{margin:0;font-size:20px;letter-spacing:.3px}
header h1 input{font-size:20px;font-weight:700;background:transparent;border:1px solid transparent;width:260px;padding:2px 6px}
header h1 input:hover{border-color:var(--line)}
#estado{margin-left:auto;color:var(--mut);font-size:12px}
#estado.err{color:var(--bad)}
.transport{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:8px}
.transport .time{font:600 22px/1 ui-monospace,Menlo,monospace;min-width:120px}
.transport .time small{color:var(--mut);font-size:13px;font-weight:400}
.transport .sp{flex:1}
.transport select{width:auto}
.transport label{color:var(--mut);font-size:12px}
.wave{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:190px;touch-action:none}
.wave canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.wave .carga{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut)}
.hint{color:var(--mut);font-size:12px;margin:6px 2px 12px}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px}
.cols{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:14px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card>h2{margin:0;padding:10px 12px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.card>h2 .sp{flex:1}
.card>h2 button{text-transform:none;letter-spacing:0;font-size:12px;padding:4px 8px}
.body{padding:10px 12px}
/* marcadores */
.mrow{display:grid;grid-template-columns:14px 78px 1fr auto;gap:6px 8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--bg)}
.mrow.on{border-color:var(--acc)}
.mrow .dot{width:12px;height:12px;border-radius:50%}
.mrow input.t{font-family:ui-monospace,Menlo,monospace;text-align:center;padding:4px}
.mrow .acts{display:flex;gap:4px}
.mrow .full{grid-column:1/-1}
.mrow .acts button{padding:3px 7px;font-size:12px}
.mrow textarea{min-height:36px}
.etapa-dur{color:var(--mut);font-size:12px;font-family:ui-monospace,Menlo,monospace}
/* escenas */
.escena{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);margin-bottom:12px;overflow:hidden;border-left-width:5px}
.escena.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.eh{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--panel2);flex-wrap:wrap}
.eh .n{font-weight:700}
.eh .etapa{font-size:12px;padding:2px 8px;border-radius:99px;color:#10141a;font-weight:600}
.eh .rango{color:var(--mut);font:12px ui-monospace,Menlo,monospace}
.eh .dur{margin-left:auto;font:700 18px ui-monospace,Menlo,monospace;color:var(--acc)}
.eb{padding:10px;display:grid;gap:8px}
.eb .fila{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eb label{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.eb .tomas{display:flex;gap:8px;align-items:center}
.eb .tomas input{width:70px}
.eb .ritmo{color:var(--acc2);font:13px ui-monospace,Menlo,monospace}
.eb .pie{display:flex;gap:6px;justify-content:flex-end}
.vacio{color:var(--mut);padding:18px;text-align:center}
.resumen{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;margin-bottom:10px}
.resumen div{display:grid;place-items:center;font-size:10px;color:#10141a;overflow:hidden;white-space:nowrap;cursor:pointer}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--acc);color:#1a1200;padding:6px 14px;border-radius:99px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><input id="titulo" value="Destello" aria-label="Título del tema"></h1>
    <span id="estado">cargando…</span>
    <button id="btnCopiar">Copiar guion</button>
    <button id="btnDescargar">Descargar .md</button>
    <button id="btnExpJson" title="Baja proyecto.json para subirlo al repo">Exportar JSON</button>
    <button id="btnImpJson" title="Carga un proyecto.json">Importar JSON</button>
    <input type="file" id="fileJson" accept=".json,application/json" hidden>
  </header>

  <div class="transport">
    <button id="btnPlay" class="pri" style="min-width:92px">▶ Play</button>
    <button id="btnM" class="pri" title="Marcar momento clave (M)">＋ Marcar (M)</button>
    <div class="time"><span id="tAct">0:00.0</span> <small>/ <span id="tTot">0:00.0</span></small></div>
    <span class="sp"></span>
    <label>Velocidad
      <select id="vel"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option></select>
    </label>
    <button id="zOut" class="ico" title="Alejar">−</button>
    <button id="zFit" title="Ver tema completo">Ver todo</button>
    <button id="zIn" class="ico" title="Acercar">＋</button>
  </div>

  <div class="wave" id="wave"><canvas id="cv"></canvas><div class="carga" id="carga">Cargando audio…</div></div>
  <div class="hint">
    <kbd>Espacio</kbd> play/pausa · <kbd>M</kbd> marcar en el cursor · <kbd>←</kbd><kbd>→</kbd> ±1 s (<kbd>Shift</kbd> ±5 s) ·
    clic = mover cursor · doble clic = marcador ahí · arrastrá un marcador para ajustarlo · <kbd>Ctrl</kbd>+rueda = zoom
  </div>

  <div class="cols">
    <section class="card">
      <h2>Etapas del tema <span class="sp"></span><button id="btnTramos" title="Crea una escena por cada etapa que todavía no tenga">Escena por etapa</button></h2>
      <div class="body" id="listaM"></div>
    </section>

    <section class="card">
      <h2>Guion por escenas <span class="sp"></span><button id="btnEscena" title="Escena nueva desde la etapa donde está el cursor">＋ Escena aquí</button></h2>
      <div class="body">
        <label style="color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em">Idea general del video</label>
        <textarea id="idea" placeholder="Concepto, tono, protagonista, locaciones, referencias…" style="margin:3px 0 12px"></textarea>
        <div class="resumen" id="resumen" title="Duración de cada escena, proporcional"></div>
        <div id="listaE"></div>
      </div>
    </section>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
const ETAPAS = [
  {k:'inicio',     n:'Inicio',        c:'#9aa5b8'},
  {k:'intro',      n:'Intro',         c:'#6ec6ff'},
  {k:'verso',      n:'Verso',         c:'#7be0a1'},
  {k:'pre',        n:'Pre-estribillo',c:'#c8e06b'},
  {k:'estribillo', n:'Estribillo',    c:'#ffb547'},
  {k:'puente',     n:'Puente',        c:'#c59bff'},
  {k:'solo',       n:'Solo / instrumental', c:'#ff8fc7'},
  {k:'golpe',      n:'Golpe / quiebre', c:'#ff6b6b'},
  {k:'silencio',   n:'Silencio',      c:'#5b6678'},
  {k:'final',      n:'Final',         c:'#4fd6d0'},
  {k:'momento',    n:'Momento clave', c:'#e6e9ee'},
];
const ET = Object.fromEntries(ETAPAS.map(e=>[e.k,e]));
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);

/* ---------- estado ---------- */
let P = nuevoProyecto();
let dur = 0, peaks = null, peakMax = 1;
function nuevoProyecto(){
  return {titulo:'Destello', idea:'', marcadores:[{id:'m0',t:0,tipo:'inicio',etiqueta:'Inicio',nota:''}], escenas:[]};
}
const mk = id => P.marcadores.find(m=>m.id===id);
const sortM = () => P.marcadores.sort((a,b)=>a.t-b.t);

function fmt(t, dec=1){
  if(!isFinite(t)) t=0; t=Math.max(0,t);
  const m=Math.floor(t/60), s=t-m*60;
  return m+':'+(s<10?'0':'')+s.toFixed(dec);
}
function parseT(str){
  str=String(str).trim().replace(',','.'); if(!str) return NaN;
  const p=str.split(':').map(Number); if(p.some(isNaN)) return NaN;
  return p.length===1?p[0]:p.length===2?p[0]*60+p[1]:p[0]*3600+p[1]*60+p[2];
}
function nextT(t){ for(const m of P.marcadores) if(m.t>t+1e-6) return m.t; return dur; }
function rango(sc){
  const a=mk(sc.desde), t0=a?a.t:0; let t1=nextT(t0);
  const b=sc.hasta&&mk(sc.hasta); if(b&&b.t>t0+1e-6) t1=b.t;
  return [t0,t1];
}
const escenasOrd = () => [...P.escenas].sort((a,b)=>rango(a)[0]-rango(b)[0]);
const activaIdx = t => { let r=-1; P.marcadores.forEach((m,i)=>{ if(m.t<=t+1e-6) r=i; }); return r; };

/* ---------- audio ---------- */
const audio = new Audio(); audio.preload='auto';
let playUntil = null;
async function cargarAudio(){
  const buf = await (await fetch('destello.mp3')).arrayBuffer();
  audio.src = URL.createObjectURL(new Blob([buf.slice(0)],{type:'audio/mpeg'}));
  const ac = new (window.AudioContext||window.webkitAudioContext)();
  const dec = await ac.decodeAudioData(buf);
  dur = dec.duration;
  const B = Math.ceil(dur*100), pk = new Float32Array(B);
  const chs = [...Array(dec.numberOfChannels).keys()].map(i=>dec.getChannelData(i)), sr=dec.sampleRate, per=sr/100;
  for(let b=0;b<B;b++){
    const a=Math.floor(b*per), z=Math.min(Math.floor((b+1)*per),dec.length); let mx=0;
    for(const d of chs) for(let i=a;i<z;i++){ const v=Math.abs(d[i]); if(v>mx) mx=v; }
    pk[b]=mx;
  }
  peaks=pk; peakMax=Math.max(...pk)||1;
  ac.close();
  $('carga').remove(); $('tTot').textContent=fmt(dur);
  fitView(); renderTodo();
}
function play(){ playUntil=null; audio.play(); }
function toggle(){ audio.paused ? play() : audio.pause(); }
function seek(t){ audio.currentTime=Math.min(Math.max(0,t),dur||0); dirty=true; }
function playTramo(t0,t1){ seek(t0); playUntil=t1; audio.play(); }

/* ---------- forma de onda ---------- */
const cv=$('cv'), ctx=cv.getContext('2d'), wave=$('wave');
let V={start:0,pps:5}, dpr=1, dirty=true;
const RULER=18, BAND=24;
const xOf = t => (t-V.start)*V.pps;
const tOf = x => V.start + x/V.pps;
function clampView(){
  const w=cv.clientWidth, minP=w/(dur||1);
  V.pps=Math.min(Math.max(V.pps,minP),600);
  V.start=Math.max(0,Math.min(V.start,(dur||0)-w/V.pps));
}
function fitView(){ V.pps=cv.clientWidth/(dur||1); V.start=0; clampView(); dirty=true; }
function zoom(f,cx){
  const w=cv.clientWidth; cx = cx ?? w/2; const tc=tOf(cx);
  V.pps*=f; clampView(); V.start=tc-cx/V.pps; clampView(); dirty=true;
}
function resize(){
  dpr=window.devicePixelRatio||1;
  cv.width=Math.round(wave.clientWidth*dpr); cv.height=Math.round(wave.clientHeight*dpr);
  clampView(); dirty=true;
}
new ResizeObserver(resize).observe(wave);

function draw(){
  const w=cv.clientWidth, h=cv.clientHeight, now=audio.currentTime;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const waveTop=RULER+18, waveBot=h-BAND-4, mid=(waveTop+waveBot)/2, half=(waveBot-waveTop)/2;
  /* regla */
  ctx.font='11px ui-monospace,Menlo,monospace'; ctx.textBaseline='middle';
  const steps=[.5,1,2,5,10,15,30,60,120]; let step=steps.find(s=>s*V.pps>=70)||120;
  ctx.fillStyle='#8b95a5'; ctx.strokeStyle='#2a313c'; ctx.lineWidth=1;
  for(let t=Math.ceil(V.start/step)*step; xOf(t)<w; t+=step){
    const x=Math.round(xOf(t))+.5; ctx.beginPath(); ctx.moveTo(x,RULER-5); ctx.lineTo(x,h-BAND); ctx.stroke();
    ctx.fillText(fmt(t,step<1?1:0),x+4,RULER/2);
  }
  /* escenas (banda inferior) */
  for(const sc of escenasOrd()){
    const [a,b]=rango(sc), x0=xOf(a), x1=xOf(b); if(x1<0||x0>w) continue;
    const c=ET[(mk(sc.desde)||{}).tipo]?.c||'#888';
    ctx.fillStyle=c+'55'; ctx.fillRect(x0+1,h-BAND,Math.max(1,x1-x0-2),BAND-2);
    ctx.fillStyle=c; ctx.fillRect(x0+1,h-BAND,Math.max(1,x1-x0-2),2);
    ctx.save(); ctx.beginPath(); ctx.rect(x0+1,h-BAND,x1-x0-2,BAND); ctx.clip();
    ctx.fillStyle='#e6e9ee'; ctx.fillText((sc.titulo||'(sin título)')+'  ·  '+(b-a).toFixed(1)+' s',Math.max(x0,0)+6,h-BAND/2);
    ctx.restore();
  }
  /* onda */
  if(peaks){
    const px=xOf(now);
    for(let x=0;x<w;x++){
      const ta=tOf(x), ia=Math.max(0,Math.floor(ta*100)), ib=Math.min(peaks.length,Math.max(ia+1,Math.ceil((ta+1/V.pps)*100)));
      if(ia>=peaks.length) break;
      let mx=0; for(let i=ia;i<ib;i++) if(peaks[i]>mx) mx=peaks[i];
      const a=Math.max(1,Math.sqrt(mx/peakMax)*half);
      ctx.fillStyle = x<px ? '#ffb547' : '#5a6678';
      ctx.fillRect(x,mid-a,1,a*2);
    }
  }
  /* marcadores */
  ctx.textBaseline='middle';
  P.marcadores.forEach((m,i)=>{
    const x=Math.round(xOf(m.t))+.5; if(x<-80||x>w+10) return;
    const c=ET[m.tipo]?.c||'#fff';
    ctx.strokeStyle=c; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,RULER); ctx.lineTo(x,h-BAND); ctx.stroke();
    const txt=m.etiqueta||ET[m.tipo]?.n||''; const tw=Math.min(ctx.measureText(txt).width+10,150);
    ctx.fillStyle=c; ctx.fillRect(x,RULER,tw,16);
    ctx.save(); ctx.beginPath(); ctx.rect(x,RULER,tw,16); ctx.clip();
    ctx.fillStyle='#10141a'; ctx.fillText(txt,x+5,RULER+8); ctx.restore();
  });
  /* cursor */
  const px=Math.round(xOf(now))+.5;
  if(px>=-5&&px<=w+5){
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,h); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(px-5,0); ctx.lineTo(px+5,0); ctx.lineTo(px,7); ctx.fill();
  }
}

/* interacción con la onda */
let drag=null;
const hitMarker = x => P.marcadores.find(m=>m.id!=='m0' && Math.abs(xOf(m.t)-x)<=6);
cv.addEventListener('pointerdown',e=>{
  const x=e.offsetX; cv.setPointerCapture(e.pointerId);
  const m=hitMarker(x);
  drag = m ? {tipo:'m',m} : {tipo:'seek'};
  if(!m) seek(tOf(x));
});
cv.addEventListener('pointermove',e=>{
  const x=e.offsetX;
  if(!drag){ cv.style.cursor = hitMarker(x)?'ew-resize':'pointer'; return; }
  const t=Math.min(Math.max(0.01,tOf(x)),dur);
  if(drag.tipo==='seek') seek(t); else { drag.m.t=Math.round(t*100)/100; dirty=true; }
});
cv.addEventListener('pointerup',()=>{
  if(drag?.tipo==='m'){ sortM(); renderTodo(); guardar(); }
  drag=null;
});
cv.addEventListener('dblclick',e=>{ if(!hitMarker(e.offsetX)) addMarker(tOf(e.offsetX)); });
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey) zoom(Math.exp(-e.deltaY*0.01),e.offsetX);
  else { V.start+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)/V.pps; clampView(); dirty=true; }
},{passive:false});

/* ---------- marcadores ---------- */
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),1400); }
function addMarker(t=audio.currentTime){
  t=Math.round(Math.min(Math.max(0,t),dur)*100)/100;
  if(P.marcadores.some(m=>Math.abs(m.t-t)<0.05)) return toast('Ya hay un marcador ahí');
  P.marcadores.push({id:uid(),t,tipo:'momento',etiqueta:'',nota:''}); sortM();
  renderTodo(); guardar(); toast('Marcador en '+fmt(t));
}
function renderMarcadores(){
  const L=$('listaM'); const conEsc=new Set(P.escenas.map(s=>s.desde));
  L.innerHTML = P.marcadores.map((m,i)=>{
    const c=ET[m.tipo]?.c||'#fff', fin=i<P.marcadores.length-1?P.marcadores[i+1].t:dur, d=fin-m.t;
    return `<div class="mrow" data-id="${m.id}">
      <span class="dot" style="background:${c}"></span>
      <input class="t" data-f="t" value="${fmt(m.t)}" ${m.id==='m0'?'disabled':''} aria-label="Tiempo">
      <select data-f="tipo" aria-label="Etapa">${ETAPAS.map(e=>`<option value="${e.k}" ${e.k===m.tipo?'selected':''}>${e.n}</option>`).join('')}</select>
      <span class="etapa-dur">${d.toFixed(1)} s</span>
      <input class="full" data-f="etiqueta" value="${esc(m.etiqueta)}" placeholder="Nombre (ej. “entra la batería”)">
      <textarea class="full" data-f="nota" placeholder="Qué pasa en la música / letra en este tramo">${esc(m.nota)}</textarea>
      <div class="acts full">
        <button data-act="play" title="Escuchar esta etapa">▶ Etapa</button>
        <button data-act="ir" title="Mover cursor aquí">Ir</button>
        <button data-act="menos" title="−0,1 s" ${m.id==='m0'?'disabled':''}>−0.1</button>
        <button data-act="mas" title="+0,1 s" ${m.id==='m0'?'disabled':''}>+0.1</button>
        <span style="flex:1"></span>
        ${conEsc.has(m.id)?`<button data-act="veresc">Ver escena</button>`:`<button data-act="escena" class="pri">＋ Escena</button>`}
        ${m.id!=='m0'?`<button data-act="borrar" title="Borrar marcador">✕</button>`:''}
      </div></div>`;
  }).join('');
}
$('listaM').addEventListener('input',e=>{
  const f=e.target.dataset.f; if(!f||f==='t'||f==='tipo') return;
  mk(e.target.closest('.mrow').dataset.id)[f]=e.target.value; dirty=true; guardar();
});
$('listaM').addEventListener('change',e=>{
  const f=e.target.dataset.f, m=f&&mk(e.target.closest('.mrow').dataset.id); if(!m) return;
  if(f==='t'){ const t=parseT(e.target.value); if(!isNaN(t)) m.t=Math.round(Math.min(Math.max(0.01,t),dur)*100)/100; sortM(); }
  else if(f==='tipo'){ m.tipo=e.target.value; }
  renderTodo(); guardar();
});
$('listaM').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]'); if(!b) return;
  const m=mk(b.closest('.mrow').dataset.id), i=P.marcadores.indexOf(m), a=b.dataset.act;
  if(a==='play') playTramo(m.t, i<P.marcadores.length-1?P.marcadores[i+1].t:dur);
  else if(a==='ir') seek(m.t);
  else if(a==='menos'||a==='mas'){ m.t=Math.max(0.01,Math.round((m.t+(a==='mas'?.1:-.1))*100)/100); sortM(); renderTodo(); guardar(); }
  else if(a==='escena') crearEscena(m.id,true);
  else if(a==='veresc'){ const s=P.escenas.find(s=>s.desde===m.id); document.querySelector(`.escena[data-id="${s.id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}); }
  else if(a==='borrar') borrarMarcador(m);
});
function borrarMarcador(m){
  const sc=P.escenas.filter(s=>s.desde===m.id);
  if(sc.some(s=>s.titulo||s.desc||s.notas) && !confirm('Este marcador abre una escena con texto. Si lo borrás, se borra la escena. ¿Seguir?')) return;
  P.escenas=P.escenas.filter(s=>s.desde!==m.id); P.escenas.forEach(s=>{ if(s.hasta===m.id) s.hasta=null; });
  P.marcadores=P.marcadores.filter(x=>x!==m); renderTodo(); guardar();
}

/* ---------- escenas ---------- */
function crearEscena(desdeId,enfocar){
  if(P.escenas.some(s=>s.desde===desdeId)) return null;
  const m=mk(desdeId);
  const s={id:uid(),desde:desdeId,hasta:null,titulo:(m.etiqueta||''),desc:'',notas:'',tomas:''};
  P.escenas.push(s); renderTodo(); guardar();
  if(enfocar){ const el=document.querySelector(`.escena[data-id="${s.id}"]`); el?.scrollIntoView({behavior:'smooth',block:'center'}); el?.querySelector('[data-f=titulo]').focus(); }
  return s;
}
function renderEscenas(){
  const L=$('listaE'), lista=escenasOrd();
  if(!lista.length){ L.innerHTML='<div class="vacio">Todavía no hay escenas. Marcá las etapas del tema y usá “＋ Escena” en cada una, o “Escena por etapa” para crearlas todas juntas.</div>'; return; }
  L.innerHTML = lista.map((s,i)=>{
    const [a,b]=rango(s), d=b-a, m=mk(s.desde)||{tipo:'momento'}, e=ET[m.tipo]||ET.momento;
    const ritmo = s.tomas>0 ? `≈ ${(d/s.tomas).toFixed(1)} s por toma` : 'Poné cuántas tomas pensás para ver el ritmo de corte';
    return `<div class="escena" data-id="${s.id}" style="border-left-color:${e.c}">
      <div class="eh">
        <span class="n">Escena ${i+1}</span>
        <span class="etapa" style="background:${e.c}">${e.n}</span>
        <span class="rango">${fmt(a)} → ${fmt(b)}</span>
        <span class="dur" title="Tiempo disponible en esta etapa">${d.toFixed(1)} s</span>
      </div>
      <div class="eb">
        <div><label>Título</label><input data-f="titulo" value="${esc(s.titulo)}" placeholder="Nombre corto de la escena"></div>
        <div><label>Qué se ve (acción, lugar, personajes)</label><textarea data-f="desc" placeholder="Pensalo para ${d.toFixed(0)} segundos de pantalla…">${esc(s.desc)}</textarea></div>
        <div><label>Cámara · luz · vestuario · efectos</label><textarea data-f="notas">${esc(s.notas)}</textarea></div>
        <div class="fila">
          <div><label>Desde</label><select data-f="desde">${P.marcadores.map(x=>`<option value="${x.id}" ${x.id===s.desde?'selected':''}>${fmt(x.t)} · ${esc(x.etiqueta||ET[x.tipo].n)}</option>`).join('')}</select></div>
          <div><label>Hasta</label><select data-f="hasta"><option value="">(siguiente marcador)</option>${P.marcadores.filter(x=>x.t>a+1e-6).map(x=>`<option value="${x.id}" ${x.id===s.hasta?'selected':''}>${fmt(x.t)} · ${esc(x.etiqueta||ET[x.tipo].n)}</option>`).join('')}</select></div>
        </div>
        <div class="tomas"><label style="margin:0">Tomas</label><input type="number" min="0" step="1" data-f="tomas" value="${esc(s.tomas)}"><span class="ritmo" data-ritmo>${ritmo}</span></div>
        <div class="pie"><button data-act="play">▶ Escuchar tramo</button><button data-act="borrar">Borrar escena</button></div>
      </div></div>`;
  }).join('');
}
$('listaE').addEventListener('input',e=>{
  const f=e.target.dataset.f; if(!f||f==='desde'||f==='hasta') return;
  const s=P.escenas.find(x=>x.id===e.target.closest('.escena').dataset.id); s[f]=e.target.value;
  if(f==='tomas'){ const [a,b]=rango(s); e.target.closest('.escena').querySelector('[data-ritmo]').textContent = s.tomas>0?`≈ ${((b-a)/s.tomas).toFixed(1)} s por toma`:'Poné cuántas tomas pensás para ver el ritmo de corte'; }
  dirty=true; guardar();
});
$('listaE').addEventListener('change',e=>{
  const f=e.target.dataset.f; if(f!=='desde'&&f!=='hasta') return;
  const s=P.escenas.find(x=>x.id===e.target.closest('.escena').dataset.id);
  if(f==='desde' && P.escenas.some(o=>o!==s&&o.desde===e.target.value)){ toast('Ya hay una escena que arranca ahí'); renderEscenas(); return; }
  s[f]=e.target.value||null; renderTodo(); guardar();
});
$('listaE').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]'); if(!b) return;
  const s=P.escenas.find(x=>x.id===b.closest('.escena').dataset.id);
  if(b.dataset.act==='play'){ const [a,z]=rango(s); playTramo(a,z); }
  else if(b.dataset.act==='borrar'){
    if((s.titulo||s.desc||s.notas)&&!confirm('¿Borrar esta escena con su texto?')) return;
    P.escenas=P.escenas.filter(x=>x!==s); renderTodo(); guardar();
  }
});
function renderResumen(){
  const lista=escenasOrd(), tot=lista.reduce((a,s)=>{const [x,y]=rango(s);return a+y-x;},0);
  $('resumen').innerHTML = lista.map(s=>{
    const [a,b]=rango(s), c=ET[(mk(s.desde)||{}).tipo]?.c||'#888';
    return `<div data-id="${s.id}" style="flex:${b-a};background:${c}" title="${esc(s.titulo||'(sin título)')} · ${(b-a).toFixed(1)} s">${(b-a)>12?(b-a).toFixed(0)+' s':''}</div>`;
  }).join('');
  $('resumen').style.display = lista.length?'flex':'none';
}
$('resumen').addEventListener('click',e=>{ const d=e.target.closest('[data-id]'); if(d) document.querySelector(`.escena[data-id="${d.dataset.id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}); });

function renderTodo(){ renderMarcadores(); renderEscenas(); renderResumen(); lastAct=null; dirty=true; }

/* ---------- guion en markdown ---------- */
function markdown(){
  let o=`# ${P.titulo} — guion\n\nDuración del tema: ${fmt(dur)} (${dur.toFixed(1)} s)\n\n`;
  if(P.idea.trim()) o+=`## Idea general\n\n${P.idea.trim()}\n\n`;
  o+=`## Etapas del tema\n\n| Desde | Hasta | Duración | Etapa | Nombre |\n|---|---|---|---|---|\n`;
  P.marcadores.forEach((m,i)=>{ const f=i<P.marcadores.length-1?P.marcadores[i+1].t:dur; o+=`| ${fmt(m.t)} | ${fmt(f)} | ${(f-m.t).toFixed(1)} s | ${ET[m.tipo].n} | ${m.etiqueta||''} |\n`; });
  o+=`\n## Escenas\n`;
  escenasOrd().forEach((s,i)=>{
    const [a,b]=rango(s), m=mk(s.desde)||{tipo:'momento'}, d=b-a;
    o+=`\n### Escena ${i+1}${s.titulo?' — '+s.titulo:''}\n\n**${ET[m.tipo].n}** · ${fmt(a)} → ${fmt(b)} · **${d.toFixed(1)} s**`;
    if(s.tomas>0) o+=` · ${s.tomas} tomas (≈ ${(d/s.tomas).toFixed(1)} s c/u)`;
    o+='\n\n';
    if(m.nota) o+=`*Música/letra:* ${m.nota}\n\n`;
    o+=`**Qué se ve:** ${s.desc||'_(pendiente)_'}\n\n`;
    if(s.notas) o+=`**Cámara · luz · vestuario:** ${s.notas}\n\n`;
  });
  return o;
}
$('btnCopiar').onclick=async()=>{ try{ await navigator.clipboard.writeText(markdown()); toast('Guion copiado'); }catch{ toast('No pude copiar'); } };
$('btnDescargar').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([markdown()],{type:'text/markdown'})); a.download='guion-'+P.titulo.toLowerCase().replace(/\W+/g,'-')+'.md'; a.click(); };

$('btnExpJson').onclick=()=>{ P.modificado=Date.now(); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(P,null,2)],{type:'application/json'})); a.download='proyecto.json'; a.click(); };
$('btnImpJson').onclick=()=>$('fileJson').click();
$('fileJson').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const d=JSON.parse(await f.text()); if(!valido(d)) throw 0;
    if(!confirm('Esto reemplaza el proyecto actual por el del archivo. ¿Seguir?')) return;
    P=Object.assign(nuevoProyecto(),d); sortM(); $('titulo').value=P.titulo; $('idea').value=P.idea; renderTodo(); guardar(); toast('Proyecto importado');
  }catch{ toast('Ese archivo no es un proyecto válido'); }
  e.target.value='';
};

/* ---------- guardado ---------- */
let hTimer=null, serverOk=true, cargado=false;
function guardar(){
  if(!cargado) return;
  $('estado').textContent='guardando…'; $('estado').classList.remove('err');
  clearTimeout(hTimer); hTimer=setTimeout(async()=>{
    P.modificado=Date.now();
    try{ localStorage.setItem('destello-proyecto',JSON.stringify(P)); }catch{}
    try{
      const r=await fetch('api/proyecto',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({proyecto:P,markdown:markdown()})});
      if(!r.ok) throw new Error(r.status);
      $('estado').textContent='guardado en proyecto.json ✓'; serverOk=true;
    }catch{ serverOk=false; $('estado').textContent='modo remoto: guardado sólo en este navegador (usá Exportar JSON para llevarlo al repo)'; }
  },500);
}
const valido = d => d&&Array.isArray(d.marcadores)&&d.marcadores.length;
async function cargarProyecto(){
  let d=null, srv=null, est=null, loc=null;
  try{ const r=await fetch('api/proyecto'); if(r.ok) srv=await r.json(); }catch{}
  if(!valido(srv)){
    srv=null;
    try{ const r=await fetch('proyecto.json',{cache:'no-store'}); if(r.ok) est=await r.json(); }catch{}   /* hosting estático (GitHub Pages) */
  }
  try{ loc=JSON.parse(localStorage.getItem('destello-proyecto')); }catch{}
  if(valido(srv)) d=srv;                                   /* con servidor local manda el disco */
  else if(valido(est)&&valido(loc)) d=(loc.modificado||0)>(est.modificado||0)?loc:est;   /* gana lo más reciente */
  else d=valido(est)?est:valido(loc)?loc:null;
  if(valido(d)) P=Object.assign(nuevoProyecto(),d);
  sortM();
  $('titulo').value=P.titulo; $('idea').value=P.idea;
  cargado=true; $('estado').textContent='listo';
}
$('titulo').addEventListener('input',e=>{ P.titulo=e.target.value; guardar(); });
$('idea').addEventListener('input',e=>{ P.idea=e.target.value; guardar(); });

/* ---------- controles y bucle ---------- */
$('btnPlay').onclick=toggle; $('btnM').onclick=()=>addMarker();
$('zIn').onclick=()=>zoom(1.5); $('zOut').onclick=()=>zoom(1/1.5); $('zFit').onclick=fitView;
$('vel').onchange=e=>{ audio.playbackRate=+e.target.value; };
$('btnTramos').onclick=()=>{
  let n=0; P.marcadores.forEach(m=>{ if(!P.escenas.some(s=>s.desde===m.id)){ P.escenas.push({id:uid(),desde:m.id,hasta:null,titulo:m.etiqueta||'',desc:'',notas:'',tomas:''}); n++; } });
  renderTodo(); guardar(); toast(n?`${n} escena${n>1?'s':''} creada${n>1?'s':''}`:'Todas las etapas ya tienen escena');
};
$('btnEscena').onclick=()=>{
  const m=P.marcadores[Math.max(0,activaIdx(audio.currentTime))];
  if(P.escenas.some(s=>s.desde===m.id)) return toast('Esa etapa ya tiene escena');
  crearEscena(m.id,true);
};
addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.code==='Space'){ e.preventDefault(); toggle(); }
  else if(e.key==='m'||e.key==='M'){ e.preventDefault(); addMarker(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); seek(audio.currentTime-(e.shiftKey?5:1)); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); seek(audio.currentTime+(e.shiftKey?5:1)); }
});

let lastAct=null, lastT=-1;
function loop(){
  const t=audio.currentTime;
  if(playUntil!=null && t>=playUntil){ audio.pause(); playUntil=null; }
  if(!audio.paused||dirty||t!==lastT){
    lastT=t; dirty=false;
    $('tAct').textContent=fmt(t); $('btnPlay').textContent=audio.paused?'▶ Play':'❚❚ Pausa';
    if(!audio.paused && !drag){ const x=xOf(t), w=cv.clientWidth; if(x>w*.9||x<0){ V.start=t-w*.1/V.pps; clampView(); } }
    const ai=activaIdx(t), am=P.marcadores[ai];
    const key=(am?.id)+'|'+escenasOrd().findIndex(s=>{const [a,b]=rango(s);return t>=a&&t<b;});
    if(key!==lastAct){
      lastAct=key;
      document.querySelectorAll('.mrow').forEach(r=>r.classList.toggle('on',r.dataset.id===am?.id));
      const ord=escenasOrd();
      document.querySelectorAll('.escena').forEach(r=>{ const s=ord.find(x=>x.id===r.dataset.id), [a,b]=rango(s); r.classList.toggle('on',t>=a&&t<b); });
    }
    draw();
  }
  requestAnimationFrame(loop);
}
(async()=>{
  await cargarProyecto(); renderTodo(); resize(); requestAnimationFrame(loop);
  try{ await cargarAudio(); }catch(err){ $('carga').textContent='No pude cargar destello.mp3: '+err.message; }
})();
</script>
</body>
